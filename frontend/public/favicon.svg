<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <style>
    .master-stroke { stroke: #04b488; }
    .master-fill { fill: #04b488; }
    .follower-stroke { stroke: #1a1c24; }
    .follower-fill { fill: #1a1c24; }

    @media (prefers-color-scheme: dark) {
      .master-stroke { stroke: #06d896; }
      .master-fill { fill: #06d896; }
      .follower-stroke { stroke: #f0f0f2; }
      .follower-fill { fill: #f0f0f2; }
    }
  </style>

  <!-- Master Trajectory (Emerald Accent - Lead Signal) -->
  <path
    class="master-stroke"
    d="M 8 21.5 C 8 12.5, 15 5.5, 25 5.5 C 31.5 5.5, 36.5 8.5, 39.5 12"
    stroke-width="3.5"
    stroke-linecap="round"
  />
  <path
    class="master-stroke"
    d="M 8 21.5 C 13.5 21.5, 18.5 18, 25.5 15.5 C 30.5 13.5, 34.5 12, 38 12"
    stroke-width="3.5"
    stroke-linecap="round"
  />
  <path class="master-fill" d="M 33 6 L 42.5 11 L 37.5 19 Z"/>

  <!-- Follower Trajectory (Synchronous Execution) -->
  <path
    class="follower-stroke"
    d="M 9.5 26.5 C 9.5 35.5, 16.5 42.5, 26.5 42.5 C 34 42.5, 39.5 37.5, 41.5 30.5"
    stroke-width="3.5"
    stroke-linecap="round"
  />
  <path
    class="follower-stroke"
    d="M 9.5 26.5 C 15 26.5, 20.5 24.5, 26.5 22.5 C 31.5 21, 35 20, 38 20"
    stroke-width="3.5"
    stroke-linecap="round"
  />
  <path class="follower-fill" d="M 33.5 15 L 43 20 L 38 28 Z"/>
</svg>