# ==============================================================================
# EnvoyTrade Canonical PostgreSQL Tuning (Single Binary & Docker Compose)
# Optimized for trading order execution, fast index scans, and micro-autovacuum
# ==============================================================================

# Network & Connections
listen_addresses = '*'
max_connections = 100

# Memory Configuration (Tuned for 4GB - 8GB VPS host)
shared_buffers = 1GB
work_mem = 32MB
maintenance_work_mem = 128MB
effective_cache_size = 3GB

# Disk, WAL & Checkpointing
wal_buffers = 16MB
checkpoint_completion_target = 0.9
random_page_cost = 1.1
effective_io_concurrency = 200

# Durability & Transaction Safety
synchronous_commit = on

# Micro-Autovacuum (Frequent small sweeps, zero table bloat, zero CPU spikes)
autovacuum = on
autovacuum_max_workers = 3
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_limit = 500
autovacuum_vacuum_cost_delay = 2ms
